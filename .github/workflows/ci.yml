name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs on main are serialized (a queued run is replaced by a newer one), so published tags only
# move forward. Pull request runs are cancelled when new commits arrive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    # Job names are referenced by status checks: keep them stable.
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    env:
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runtime versions (from the production Dockerfile)
        id: versions
        working-directory: .
        run: .github/scripts/runtime-versions.sh >> "$GITHUB_OUTPUT"

      # Same MySQL and Redis as local development: compose.yaml is the single source of truth.
      - name: Start MySQL and Redis
        working-directory: .
        run: docker compose up --detach mysql redis

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ steps.versions.outputs.php }}
          extensions: ${{ steps.versions.outputs.php_extensions }}
          coverage: pcov
          tools: composer:${{ steps.versions.outputs.composer }}

      - name: Validate composer.json and lock file
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: composer lint

      - name: Static analysis (Larastan, max level)
        run: composer analyse -- --no-progress --error-format=github

      - name: Wait for MySQL and Redis to be healthy
        working-directory: .
        run: docker compose up --detach --wait mysql redis

      - name: Tests with coverage (minimum 90%)
        run: php artisan test --coverage --min=90

      - name: API contract is up to date (run `composer api:docs` if this fails)
        run: |
          composer api:docs
          git diff --exit-code -- openapi.json

      - name: Dependency audit
        run: composer audit

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runtime versions (from the production Dockerfile)
        id: versions
        working-directory: .
        run: .github/scripts/runtime-versions.sh >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Formatting (Prettier)
        run: npm run check:format

      - name: Lint (oxlint + ESLint)
        run: npm run check:lint

      - name: Type check (vue-tsc)
        run: npm run type-check

      - name: Generated API types are up to date (run `npm run api:types` if this fails)
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build-only

  collector:
    name: collector
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Redaction rules keep personal data out of traces
        run: infra/otel/test-redaction.sh

  images:
    name: image (${{ matrix.target }})
    needs: [api, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, edge]
    env:
      # Time-boxed exceptions (each with reason and expiry date).
      TRIVY_IGNOREFILE: .trivyignore.yaml
      # Only pushes to main publish images; pull requests build and verify them locally.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        env:
          TARGET: ${{ matrix.target }}
        # Registry names must be lowercase; the repository owner is not.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${TARGET}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (verification only)
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          load: true
          tags: ${{ steps.name.outputs.image }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      # The image is pushed once, by digest and without tags. Only after it passes the checks
      # below does that exact digest receive its tags: what was verified is what ships.
      - name: Build and push by digest
        id: build
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

      - name: Image under test
        id: ref
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${IMAGE}:ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke checks
        env:
          TARGET: ${{ matrix.target }}
          REF: ${{ steps.ref.outputs.ref }}
        run: .github/scripts/smoke-image.sh "$TARGET" "$REF"

      - name: Vulnerability scan (report for the Security tab)
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.ref.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.target }}.sarif
          limit-severities-for-sarif: true

      # Only from main: the Security tab tracks the default branch, and pull requests from
      # Dependabot run with a read-only token that cannot upload results.
      - name: Upload scan results
        if: env.PUBLISH == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.target }}.sarif
          category: image-${{ matrix.target }}

      - name: Vulnerability gate (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.ref.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

      # Deployments use the immutable `sha-<commit>` tag; `latest` is a convenience pointer.
      - name: Tag the verified image
        if: env.PUBLISH == 'true'
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          docker buildx imagetools create "${args[@]}" "$REF"
          docker buildx imagetools inspect "${tags[0]}"
