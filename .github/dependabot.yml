version: 2

updates:
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) has no JavaScript API yet; vue-tsc, typescript-eslint and
      # the Vue SFC compiler depend on it. Revisit when vue-tsc supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node type definitions follow the Node runtime (LTS 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    ignore:
      # Runtime versions are deliberate decisions: only patch updates are automatic.
      # PHP stays on 8.3 (same as local development).
      - dependency-name: "*php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node follows the LTS line (24).
      - dependency-name: "*node"
        update-types: ["version-update:semver-major"]
      # MySQL stays on the 8.4 LTS line.
      - dependency-name: "*mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Redis 8 changes the license; moving to it is a separate decision.
      - dependency-name: "*redis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Runtime versions are deliberate decisions: only patch updates are automatic.
      # PHP stays on 8.3 (same as local development).
      - dependency-name: "*php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Node follows the LTS line (24).
      - dependency-name: "*node"
        update-types: ["version-update:semver-major"]
      # MySQL stays on the 8.4 LTS line.
      - dependency-name: "*mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Redis 8 changes the license; moving to it is a separate decision.
      - dependency-name: "*redis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
