version: 2

updates:
  - package-ecosystem: composer
    directory: /api
    schedule:
      interval: weekly
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (native compiler) has no JavaScript API yet; vue-tsc, typescript-eslint and
      # the Vue SFC compiler depend on it. Revisit when vue-tsc supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
