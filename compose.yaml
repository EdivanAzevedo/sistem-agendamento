name: agendamento

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./api:/var/www/api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: docker.io/library/node:26.10.0-alpine3.24
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # File-change events from the host do not reach containers on macOS VMs; poll instead.
      VITE_USE_POLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules

  caddy:
    image: docker.io/library/caddy:2.11.4-alpine
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./api/public:/var/www/api/public:ro
    depends_on:
      - api
      - web

  mysql:
    image: docker.io/library/mysql:8.4.11
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.io/library/redis:7.4.11-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: docker.io/axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  mysql_data:
  web_node_modules:
